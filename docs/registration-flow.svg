<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="430" viewBox="0 0 1280 430" role="img" aria-labelledby="title desc">
  <title id="title">Simple thin-mcp tool registration flow</title>
  <desc id="desc">At startup, the application core imports its tools package. That package imports tool modules in a deliberate order. Each module registers its handlers in one thin-mcp ToolRegistry, which is then passed to McpServer for listing and execution.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <style>
      .heading { font: 700 23px system-ui, -apple-system, sans-serif; fill: #0f172a; }
      .boundary { font: 700 16px system-ui, -apple-system, sans-serif; fill: #0f172a; }
      .label { font: 600 16px system-ui, -apple-system, sans-serif; fill: #0f172a; }
      .small { font: 14px system-ui, -apple-system, sans-serif; fill: #334155; }
      .tiny { font: 12px system-ui, -apple-system, sans-serif; fill: #475569; }
      .arrow { stroke: #475569; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .host-boundary { fill: #fcfaff; stroke: #a855f7; stroke-width: 2; stroke-dasharray: 8 6; }
      .library-boundary { fill: #f8fbff; stroke: #3b82f6; stroke-width: 2; stroke-dasharray: 8 6; }
      .host { fill: #f3e8ff; stroke: #9333ea; stroke-width: 2; }
      .library { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
    </style>
  </defs>

  <rect x="12" y="12" width="1256" height="406" rx="20" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="40" y="54" class="heading">Startup: import tools once, then share one registry</text>

  <rect x="36" y="92" width="750" height="260" rx="16" class="host-boundary"/>
  <text x="58" y="124" class="boundary">Application code</text>

  <rect x="66" y="165" width="190" height="126" rx="12" class="host"/>
  <text x="161" y="202" text-anchor="middle" class="label">core.py</text>
  <text x="161" y="230" text-anchor="middle" class="small">imports the tools</text>
  <text x="161" y="253" text-anchor="middle" class="small">package</text>

  <path d="M256 228 H291" class="arrow"/>

  <rect x="296" y="165" width="210" height="126" rx="12" class="host"/>
  <text x="401" y="202" text-anchor="middle" class="label">tools/__init__.py</text>
  <text x="401" y="230" text-anchor="middle" class="small">imports domain modules</text>
  <text x="401" y="253" text-anchor="middle" class="small">in a stable order</text>

  <path d="M506 228 H541" class="arrow"/>

  <rect x="546" y="165" width="210" height="126" rx="12" class="host"/>
  <text x="651" y="202" text-anchor="middle" class="label">Tool modules</text>
  <text x="651" y="230" text-anchor="middle" class="small">register typed handlers</text>
  <text x="651" y="253" text-anchor="middle" class="small">with @registry.register</text>

  <rect x="816" y="92" width="428" height="260" rx="16" class="library-boundary"/>
  <text x="838" y="124" class="boundary">thin_mcp library</text>

  <path d="M756 228 H851" class="arrow"/>
  <text x="803" y="214" text-anchor="middle" class="tiny">adds entries</text>

  <rect x="856" y="165" width="165" height="126" rx="12" class="library"/>
  <text x="938" y="202" text-anchor="middle" class="label">ToolRegistry</text>
  <text x="938" y="230" text-anchor="middle" class="small">one ordered</text>
  <text x="938" y="253" text-anchor="middle" class="small">registry</text>

  <path d="M1021 228 H1052" class="arrow"/>

  <rect x="1057" y="165" width="165" height="126" rx="12" class="library"/>
  <text x="1139" y="202" text-anchor="middle" class="label">McpServer</text>
  <text x="1139" y="230" text-anchor="middle" class="small">lists and executes</text>
  <text x="1139" y="253" text-anchor="middle" class="small">the same entries</text>

  <text x="40" y="388" class="tiny">Explicit imports keep startup predictable. No file scanning or Django startup hooks are needed.</text>
</svg>
