<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">Client request paths</title>
  <desc id="desc">Requests enter the web app framework. Ordinary endpoints call core functions; MCP endpoints call thin_mcp.McpServer, which dispatches registered tool handlers to the core functions.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 25px system-ui, -apple-system, sans-serif; fill: #0f172a; }
      .lane-title { font: 700 17px system-ui, -apple-system, sans-serif; fill: #0f172a; }
      .label { font: 600 16px system-ui, -apple-system, sans-serif; fill: #0f172a; }
      .small { font: 14px system-ui, -apple-system, sans-serif; fill: #334155; }
      .tiny { font: 12px system-ui, -apple-system, sans-serif; fill: #475569; }
      .arrow { stroke: #475569; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .flow-label { font: 12px system-ui, -apple-system, sans-serif; fill: #475569; }
      .lane { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .host-boundary { fill: #fcfaff; stroke: #a855f7; stroke-width: 2; stroke-dasharray: 8 6; }
      .library-boundary { fill: #f8fbff; stroke: #3b82f6; stroke-width: 2; stroke-dasharray: 8 6; }
      .host { fill: #f3e8ff; stroke: #9333ea; stroke-width: 2; }
      .library { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
      .domain { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
      .client { fill: #f1f5f9; stroke: #64748b; stroke-width: 2; }
    </style>
  </defs>

  <rect x="12" y="12" width="1416" height="696" rx="22" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="42" y="55" class="title">Client request paths</text>

  <!-- Lane 1: clients -->
  <rect x="38" y="94" width="190" height="570" rx="16" class="lane"/>
  <text x="60" y="130" class="lane-title">1 · Clients</text>
  <rect x="54" y="195" width="158" height="104" rx="14" class="client"/>
  <text x="133" y="231" text-anchor="middle" class="label">App client</text>
  <rect x="54" y="426" width="158" height="104" rx="14" class="client"/>
  <text x="133" y="462" text-anchor="middle" class="label">MCP client</text>

  <!-- Lane 2: application web framework -->
  <rect x="278" y="94" width="1110" height="570" rx="18" class="host-boundary"/>
  <text x="302" y="130" class="lane-title">Web app</text>

  <rect x="300" y="154" width="218" height="486" rx="16" class="lane"/>
  <text x="322" y="187" class="lane-title">2 · Framework</text>
  <rect x="324" y="300" width="166" height="144" rx="14" class="host"/>
  <text x="407" y="353" text-anchor="middle" class="label">Django Ninja</text>
  <text x="407" y="382" text-anchor="middle" class="small">or FastAPI</text>

  <!-- Lane 3: two application view paths; MCP then enters the library. -->
  <rect x="536" y="154" width="270" height="486" rx="16" class="lane"/>
  <text x="558" y="187" class="lane-title">3 · Application views</text>

  <rect x="558" y="224" width="226" height="116" rx="14" class="host"/>
  <text x="671" y="261" text-anchor="middle" class="label">Ordinary endpoints</text>

  <rect x="558" y="440" width="226" height="116" rx="14" class="host"/>
  <text x="671" y="477" text-anchor="middle" class="label">MCP endpoints</text>

  <rect x="812" y="408" width="256" height="160" rx="16" class="library-boundary"/>
  <text x="832" y="436" class="tiny">thin_mcp</text>
  <rect x="834" y="452" width="212" height="92" rx="12" class="library"/>
  <text x="940" y="484" text-anchor="middle" class="label">thin_mcp.McpServer</text>

  <!-- Lane 4: application-owned domain logic. -->
  <rect x="1120" y="154" width="248" height="486" rx="16" class="lane"/>
  <text x="1142" y="187" class="lane-title">4 · Core functions</text>
  <rect x="1142" y="300" width="204" height="154" rx="14" class="domain"/>
  <text x="1244" y="382" text-anchor="middle" class="label">Core functions</text>

  <!-- Client requests enter the same framework and split by route. -->
  <path d="M228 372 H316" class="arrow"/>
  <path d="M490 372 H528" class="arrow"/>

  <!-- Both paths reach application-owned core functions. -->
  <path d="M784 282 H1116 V350 H1146" class="arrow"/>
  <path d="M784 498 H826" class="arrow"/>
  <path d="M1046 498 H1116 V408 H1146" class="arrow"/>
</svg>
