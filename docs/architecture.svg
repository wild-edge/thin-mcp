<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="520" viewBox="0 0 1240 520" role="img" aria-labelledby="title desc">
  <title id="title">thin-mcp host application architecture</title>
  <desc id="desc">An MCP client calls a Django endpoint, which delegates to thin-mcp. The dispatcher executes a registered host tool adapter, and that adapter calls the owning Django domain service.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <style>
      .label { font: 600 17px system-ui, -apple-system, sans-serif; fill: #0f172a; }
      .small { font: 14px system-ui, -apple-system, sans-serif; fill: #334155; }
      .tiny { font: 12px system-ui, -apple-system, sans-serif; fill: #475569; }
      .arrow { stroke: #475569; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .host { fill: #f3e8ff; stroke: #9333ea; stroke-width: 2; }
      .library { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
      .domain { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
      .client { fill: #f1f5f9; stroke: #64748b; stroke-width: 2; }
    </style>
  </defs>

  <rect x="12" y="12" width="1216" height="496" rx="20" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="40" y="52" class="label">One request, three ownership boundaries</text>

  <rect x="42" y="180" width="150" height="110" rx="14" class="client"/>
  <text x="117" y="220" text-anchor="middle" class="label">MCP client</text>
  <text x="117" y="247" text-anchor="middle" class="small">JSON-RPC request</text>
  <text x="117" y="269" text-anchor="middle" class="small">protocol header</text>

  <path d="M192 235 H236" class="arrow"/>

  <rect x="240" y="150" width="185" height="170" rx="14" class="host"/>
  <text x="332" y="188" text-anchor="middle" class="label">mcp_server/api.py</text>
  <text x="332" y="217" text-anchor="middle" class="small">Django Ninja route</text>
  <text x="332" y="241" text-anchor="middle" class="small">authentication</text>
  <text x="332" y="265" text-anchor="middle" class="small">throttle and audit</text>
  <text x="332" y="289" text-anchor="middle" class="small">safe HTTP response</text>

  <path d="M425 235 H469" class="arrow"/>

  <rect x="473" y="150" width="190" height="170" rx="14" class="library"/>
  <text x="568" y="188" text-anchor="middle" class="label">thin_mcp</text>
  <text x="568" y="217" text-anchor="middle" class="small">protocol dispatch</text>
  <text x="568" y="241" text-anchor="middle" class="small">typed validation</text>
  <text x="568" y="265" text-anchor="middle" class="small">permission order</text>
  <text x="568" y="289" text-anchor="middle" class="small">result envelopes</text>

  <path d="M663 235 H707" class="arrow"/>

  <rect x="711" y="150" width="200" height="170" rx="14" class="host"/>
  <text x="811" y="188" text-anchor="middle" class="label">tools/projects.py</text>
  <text x="811" y="217" text-anchor="middle" class="small">registered adapter</text>
  <text x="811" y="241" text-anchor="middle" class="small">Pydantic schemas</text>
  <text x="811" y="265" text-anchor="middle" class="small">object permissions</text>
  <text x="811" y="289" text-anchor="middle" class="small">result mapping</text>

  <path d="M911 235 H955" class="arrow"/>

  <rect x="959" y="150" width="235" height="170" rx="14" class="domain"/>
  <text x="1076" y="188" text-anchor="middle" class="label">projects/services.py</text>
  <text x="1076" y="217" text-anchor="middle" class="small">business rules</text>
  <text x="1076" y="241" text-anchor="middle" class="small">models and queries</text>
  <text x="1076" y="265" text-anchor="middle" class="small">transactions</text>
  <text x="1076" y="289" text-anchor="middle" class="small">external integrations</text>

  <rect x="240" y="360" width="671" height="86" rx="12" fill="#faf5ff" stroke="#c084fc" stroke-dasharray="7 5"/>
  <text x="260" y="392" class="label">Host application owns mcp_server/</text>
  <text x="260" y="418" class="small">The host composes transport policy, the shared registry, and thin adapters for its domains.</text>

  <rect x="959" y="360" width="235" height="86" rx="12" fill="#f0fdf4" stroke="#4ade80" stroke-dasharray="7 5"/>
  <text x="977" y="392" class="label">Domain apps stay canonical</text>
  <text x="977" y="418" class="small">Tools call services directly.</text>

  <text x="40" y="486" class="tiny">Purple: host MCP integration · Blue: reusable thin-mcp dependency · Green: host domain logic</text>
</svg>
