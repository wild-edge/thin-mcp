[tox]
requires = tox>=4
env_list = py311, py312, py313, py314
skip_missing_interpreters = false

[testenv]
description = Run package and host example tests on {base_python}
package = wheel
extras = django
deps =
    pytest>=8.3
    pytest-cov>=6
    fastapi
    httpx
commands =
    python -m pytest {posargs:tests}
    python -m pytest examples --no-cov
